[package]
name = "zen-agentic-native"
version = "0.1.0"
edition = "2021"
authors = ["Zen Agentic Team"]
description = "Native messaging host for Zen Browser Agentic Extension"
license = "MIT"

[dependencies]
# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Base64 and chrono for ML and timestamps
base64 = "0.21"
chrono = "0.4"

# Image encoding (for screen capture)
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# UUID for element identification
uuid = { version = "1.0", features = ["v4"] }

# Runtime version info
rustc_version_runtime = "0.3"

# CoreGraphics for screen capture (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.22"
core-foundation = "0.9"

# Windows: DXGI Desktop Duplication FFI
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "d3d11", "dxgi"] }

# Linux: X11/Wayland screen capture FFI
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xinput", "xfixes"] }
wayland-client = { version = "0.28" }

# Threads for parallel capture
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true