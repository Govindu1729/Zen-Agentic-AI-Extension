<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zen Agentic AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
        }

        header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected {
            background: #4CAF50;
        }

        .status-text {
            font-size: 12px;
            color: #666;
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tool-btn {
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .tool-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.user {
            background: #e3f2fd;
            color: #1565c0;
        }

        .message.assistant {
            background: #f5f5f5;
        }

        .message.system {
            background: #fff3e0;
            color: #ef6c00;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .chat-input {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #1976d2;
        }

        .chat-input button {
            padding: 10px 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ccc;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Zen Agentic AI</h1>
            <div class="connection-status">
                <span class="status-dot" id="connectionStatus"></span>
                <span class="status-text" id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="tools">
            <button class="tool-btn" id="btnSnapshot" disabled>📸 Snapshot</button>
            <button class="tool-btn" id="btnNetwork" disabled>🌐 Network</button>
            <button class="tool-btn" id="btnAnalyze" disabled>📊 Analyze</button>
            <button class="tool-btn" id="btnScreenCapture" disabled>🖥️ Screen</button>
        </div>

        <div class="chat" id="chatMessages">
            <div class="message system">Welcome to Zen Agentic AI. Click Connect to start.</div>
        </div>

        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Ask about this page..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
